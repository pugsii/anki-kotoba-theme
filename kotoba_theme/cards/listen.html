{{#SentenceAudio}}
<div class="front listen">
  <div id="word" hidden>{{kanji:Word}}</div>
  <button class="listen-play" aria-label="Play the line again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
  <div class="listen-hint">何て言ってる？</div>
  <div class="listen-audio" hidden>{{SentenceAudio}}</div>
</div>
{{/SentenceAudio}}

<script>
// Listening card: play one of the note's scene clips; the back shows that scene (sessionStorage "jp-ex").
// Per-card state lives on JP, rebuilt for every card (desktop Anki keeps one page and reruns this script).
var JP = { renderDicts: null };

// ----- Settings (keep identical to the back template) -----
// Defaults come from the settings block at the top of Styling (synced); the ⚙ panel on the back
// saves overrides on this device in localStorage "jp-settings".
JP.themes = ["washi", "ai", "matcha", "sakura", "sumi", "yamabuki", "umi", "fuji", "kissa", "yoru", "urushi", "hotaru", "neon"];
JP.read = function (defaultsOnly) {
  var css = getComputedStyle(document.body);
  var get = function (k) { return css.getPropertyValue(k).trim().replace(/^["']|["']$/g, ""); };
  var s = { theme: get("--theme"), layout: get("--sentence-layout"), dictOrder: get("--dict-order"), motion: get("--motion") };
  if (!defaultsOnly) try {
    var local = JSON.parse(localStorage.getItem("jp-settings") || "{}");
    for (var k in local) s[k] = local[k];
  } catch (e) {}
  if (s.motion !== "on" && s.motion !== "off")  // "auto", or a Styling from before the setting
    s.motion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on";
  return s;
};
JP.apply = function (s) {
  var theme = s.theme === "weekly" ? JP.themes[Math.floor(Date.now() / 6048e5) % JP.themes.length] : s.theme;
  var cls = document.body.classList;
  JP.themes.forEach(function (t) { cls.remove("t-" + t); });
  cls.add("t-" + theme);
  cls.toggle("s-vertical", s.layout === "vertical");
  if (JP.renderDicts) JP.renderDicts(s.dictOrder);
};
JP.apply(JP.read());

// ----- Pick a scene with audio and play it -----
(function () {
  var box = document.querySelector(".listen-audio");
  if (!box) return;
  // Clips stored as <audio src>; [sound:] clips Anki renders and plays itself
  var clips = box.innerHTML.split(/<hr[^>]*>/i).map(function (part, i) {
    var m = part.match(/<audio\b[^>]*\bsrc=["']([^"']+)["']/i);
    return m && { src: m[1], i: i };
  }).filter(Boolean);
  if (!clips.length) return;
  var clip = clips[Math.floor(Math.random() * clips.length)];
  try { sessionStorage.setItem("jp-ex", document.getElementById("word").textContent + "|" + clip.i); } catch (e) {}
  var audio = new Audio(clip.src);
  function play() { audio.currentTime = 0; audio.play().catch(function () {}); }
  document.querySelector(".listen-play").onclick = play;
  play();
})();
</script>
